events {
     worker_connections 1024;
 }

 http {
     # API Gateway Rate Limiting: Max 10 requests/second per IP (Anti-DDoS protection)
     limit_req_zone $binary_remote_addr zone=pokeapi_limit:10m rate=10r/s;

     # Internal Docker Upstream Service for PokéAPI
     upstream pokeapi_service {
         server app2:8080;
     }

     # Internal Docker Upstream Service for Movies (Shared EC2 Gateway)
     upstream movies_service {
         server app1:8080;
     }

     # Dynamic Routing based on Gateway Session Cookie
     map $cookie_active_app $target_backend {
         default   "http://pokeapi_service";
         "pokemon" "http://pokeapi_service";
         "movies"  "http://movies_service";
     }

     server {
         listen 80;
         server_name _;

         # Hide internal Nginx version
         server_tokens off;

         # API Gateway Security Headers
         add_header X-Frame-Options "SAMEORIGIN" always;
         add_header X-XSS-Protection "1; mode=block" always;
         add_header X-Content-Type-Options "nosniff" always;
         add_header Referrer-Policy "no-referrer-when-downgrade" always;

         # Gateway Portal Menu (Accessible at /gateway)
         location = /gateway {
             default_type text/html;
             return 200 '<!DOCTYPE html>
             <html lang="en" class="dark">
             <head>
                 <meta charset="UTF-8">
                 <title>AWS API Gateway Portal</title>
                 <script src="https://cdn.tailwindcss.com"></script>
             </head>
             <body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
                 <div class="max-w-xl w-full bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-8 text-center">
                     <span class="px-3 py-1 text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-full">NGINX API GATEWAY ACTIVE</span>
                     <h1 class="text-2xl font-bold mt-4 mb-2">Cloud Microservices Portal</h1>
                     <p class="text-slate-400 text-sm mb-8">Backend port 8082 is isolated inside a private Docker network. Select a service to route traffic securely through Port 80:</p>
                     <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                         <a href="/switch/pokemon" class="p-5 bg-slate-700/50 hover:bg-amber-500/20 border border-slate-600 hover:border-amber-500 rounded-lg transition group">
                             <h2 class="text-lg font-semibold group-hover:text-amber-400">PokéAPI Client</h2>
                             <p class="text-xs text-slate-400 mt-1">Spring Boot + Thymeleaf REST</p>
                         </a>
                         <a href="/switch/movies" class="p-5 bg-slate-700/50 hover:bg-indigo-600/20 border border-slate-600 hover:border-indigo-500 rounded-lg transition group">
                             <h2 class="text-lg font-semibold group-hover:text-indigo-400">Movies Catalog</h2>
                             <p class="text-xs text-slate-400 mt-1">Spring Boot + PostgreSQL</p>
                         </a>
                     </div>
                 </div>
             </body>
             </html>';
         }

         # Route Switcher -> Pokemon Microservice
         location = /switch/pokemon {
             add_header Set-Cookie "active_app=pokemon; Path=/; HttpOnly; SameSite=Lax";
             return 302 /;
         }

         # Route Switcher -> Movies Microservice
         location = /switch/movies {
             add_header Set-Cookie "active_app=movies; Path=/; HttpOnly; SameSite=Lax";
             return 302 /;
         }

         # Main API Gateway Proxy Entrypoint
         location / {
             limit_req zone=pokeapi_limit burst=20 nodelay;

             proxy_pass $target_backend;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
         }
     }
 }