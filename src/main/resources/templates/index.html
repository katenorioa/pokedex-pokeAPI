<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Spring Boot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        [data-bs-theme="light"] body { background-color: #f4f6f9; }
        [data-bs-theme="dark"] body { background-color: #121212; }

        .poke-logo {
            max-width: 260px;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }
        .poke-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
        }
        .poke-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.25) !important;
        }
        .poke-img {
            height: 200px;
            object-fit: contain;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(233,236,239,0.5) 100%);
            padding: 15px;
        }
        [data-bs-theme="dark"] .poke-img {
            background: radial-gradient(circle, #2b3035 0%, #1a1d20 100%);
        }
        .pixel-mode {
            image-rendering: pixelated;
            padding: 0px !important;
            transform: scale(1.45);
        }
    </style>
</head>
<body>

<div class="container py-4">
    <!-- Top bar buttons (Dark Mode & Pixel Art) -->
    <div class="d-flex justify-content-end gap-2 mb-3">
        <button id="btnPixel" class="btn btn-outline-primary fw-bold shadow-sm" onclick="togglePixelArt()">
            👾 Pixel Art Mode
        </button>
        <button id="btnTheme" class="btn btn-outline-dark fw-bold shadow-sm" onclick="toggleDarkMode()">
            🌙 Dark Mode
        </button>
    </div>

    <!-- Pokémon Logo -->
    <div class="text-center mb-4">
        <a th:href="@{/}">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg"
                 alt="Pokémon Logo" class="poke-logo">
        </a>
    </div>

    <!-- Search bar with 4-second delay -->
    <div class="row justify-content-center mb-4">
        <div class="col-12 col-md-8 col-lg-6">
            <form id="formBuscar" th:action="@{/}" method="get" class="d-flex flex-column flex-sm-row gap-2">
                <input type="text" name="buscar" class="form-control form-control-lg shadow-sm"
                       placeholder="Search by name or ID (e.g. gengar, 94)..." th:value="${buscar}">
                <button type="submit" id="btnSubmit" class="btn btn-danger btn-lg shadow-sm text-nowrap">
                    Search
                </button>
                <a th:if="${buscar != null and !buscar.isEmpty()}" th:href="@{/}" class="btn btn-secondary btn-lg shadow-sm">
                    Clear
                </a>
            </form>
            <div id="mensajeEspera" class="text-center mt-3 d-none">
                <div class="spinner-border text-danger spinner-border-sm me-2" role="status"></div>
                <span class="fw-bold text-danger">Searching Pokédex... (waiting 4 seconds)</span>
            </div>
        </div>
    </div>

    <!-- Nested Selects Filter with Fetch/Promises -->
    <div class="row justify-content-center mb-5">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card shadow-sm border-0 p-3">
                <h6 class="fw-bold text-danger mb-3">⚡ Quick Type Explorer (Nested Endpoint + Fetch/Promises)</h6>
                <div class="row g-2">
                    <div class="col-12 col-sm-6">
                        <label class="form-label small fw-bold text-secondary">1. Select a Type:</label>
                        <select id="selectTipo" class="form-select shadow-sm">
                            <option value="">Loading types from PokéAPI...</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-6">
                        <label class="form-label small fw-bold text-secondary">2. Pokémon (Concatenated Response):</label>
                        <select id="selectPokemonAnidado" class="form-select shadow-sm" disabled>
                            <option value="">Select a type first...</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Error message -->
    <div th:if="${error}" class="alert alert-warning text-center col-md-6 mx-auto shadow-sm" role="alert">
        <span th:text="${error}"></span>
    </div>

    <!-- Responsive 3-Column Grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
        <div class="col" th:each="poke : ${pokemones}">
            <a th:href="@{/pokemon/{nombre}(nombre=${poke.nombre})}" class="text-decoration-none">
                <div class="card h-100 shadow-sm border-0 poke-card">
                    <img th:src="${poke.imagen}"
                         th:data-hd="${poke.imagen}"
                         th:data-pixel="${poke.imagenPixel}"
                         class="card-img-top poke-img switchable-img"
                         th:alt="${poke.nombre}">
                    <div class="card-body text-center">
                        <span class="badge bg-secondary mb-2" th:text="'#' + ${poke.id}"></span>
                        <h4 class="card-title text-capitalize fw-bold" th:text="${poke.nombre}"></h4>
                        <p class="card-text text-body-secondary small mt-2" th:text="${poke.descripcion}"></p>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- Pagination -->
    <div th:if="${buscar == null or buscar.isEmpty()}" class="d-flex justify-content-center align-items-center gap-3 mt-5">
        <a th:if="${paginaActual > 0}"
           th:href="@{/(pagina=${paginaActual - 1})}"
           class="btn btn-danger px-4 fw-bold shadow-sm">&larr; Previous</a>

        <span class="fw-bold fs-5" th:text="'Page ' + (${paginaActual + 1})"></span>

        <a th:href="@{/(pagina=${paginaActual + 1})}"
           class="btn btn-danger px-4 fw-bold shadow-sm">Next &rarr;</a>
    </div>
</div>

<script>
    const formBuscar = document.getElementById('formBuscar');
    const btnSubmit = document.getElementById('btnSubmit');
    const mensajeEspera = document.getElementById('mensajeEspera');

    formBuscar.addEventListener('submit', function(event) {
        event.preventDefault();
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = '⏳ Searching...';
        mensajeEspera.classList.remove('d-none');

        setTimeout(() => {
            formBuscar.submit();
        }, 4000);
    });

    function aplicarTema(tema) {
        document.documentElement.setAttribute('data-bs-theme', tema);
        const btnTheme = document.getElementById('btnTheme');
        if (tema === 'dark') {
            btnTheme.innerHTML = '☀️ Light Mode';
            btnTheme.className = 'btn btn-outline-light fw-bold shadow-sm';
        } else {
            btnTheme.innerHTML = '🌙 Dark Mode';
            btnTheme.className = 'btn btn-outline-dark fw-bold shadow-sm';
        }
    }

    function toggleDarkMode() {
        const actual = document.documentElement.getAttribute('data-bs-theme');
        const nuevo = actual === 'dark' ? 'light' : 'dark';
        localStorage.setItem('pokeTema', nuevo);
        aplicarTema(nuevo);
    }

    function aplicarPixelArt(esPixel) {
        const imagenes = document.querySelectorAll('.switchable-img');
        const btnPixel = document.getElementById('btnPixel');

        imagenes.forEach(img => {
            const hdUrl = img.getAttribute('data-hd');
            const pixelUrl = img.getAttribute('data-pixel');
            if (esPixel && pixelUrl) {
                img.src = pixelUrl;
                img.classList.add('pixel-mode');
            } else {
                img.src = hdUrl;
                img.classList.remove('pixel-mode');
            }
        });

        if (esPixel) {
            btnPixel.innerHTML = '✨ HD Mode';
            btnPixel.classList.replace('btn-outline-primary', 'btn-primary');
        } else {
            btnPixel.innerHTML = '👾 Pixel Art Mode';
            btnPixel.classList.replace('btn-primary', 'btn-outline-primary');
        }
    }

    function togglePixelArt() {
        const esPixelActual = localStorage.getItem('pokePixel') === 'true';
        const nuevoEstado = !esPixelActual;
        localStorage.setItem('pokePixel', nuevoEstado);
        aplicarPixelArt(nuevoEstado);
    }

    const selectTipo = document.getElementById('selectTipo');
    const selectPokemonAnidado = document.getElementById('selectPokemonAnidado');

    function cargarTipos() {
        fetch('https://pokeapi.co/api/v2/type')
            .then(response => response.json())
            .then(data => {
                selectTipo.innerHTML = '<option value="">-- Choose an elemental type --</option>';
                data.results.forEach(tipo => {
                    const option = document.createElement('option');
                    option.value = tipo.url;
                    option.textContent = tipo.name.toUpperCase();
                    selectTipo.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Error loading types:', error);
                selectTipo.innerHTML = '<option value="">Error loading types</option>';
            });
    }

    selectTipo.addEventListener('change', async function() {
        const urlEndpointAnidado = this.value;

        if (!urlEndpointAnidado) {
            selectPokemonAnidado.innerHTML = '<option value="">Select a type first...</option>';
            selectPokemonAnidado.disabled = true;
            return;
        }

        selectPokemonAnidado.disabled = true;
        selectPokemonAnidado.innerHTML = '<option value="">⏳ Querying nested endpoint...</option>';

        try {
            const resTipo = await fetch(urlEndpointAnidado);
            const dataTipo = await resTipo.json();
            const primerosPokemon = dataTipo.pokemon.slice(0, 8);

            const promesasDetalle = primerosPokemon.map(item =>
                fetch(item.pokemon.url).then(res => res.json())
            );

            const detallesPokemones = await Promise.all(promesasDetalle);

            selectPokemonAnidado.innerHTML = '<option value="">-- Select a Pokémon to view details --</option>';

            detallesPokemones.forEach(poke => {
                const tiposConcatenados = poke.types.map(t => t.type.name).join('/');
                const alturaMetros = poke.height / 10;
                const textoConcatenado = `#${poke.id} - ${poke.name.toUpperCase()} [${tiposConcatenados}] | Height: ${alturaMetros}m`;

                const option = document.createElement('option');
                option.value = poke.name;
                option.textContent = textoConcatenado;
                selectPokemonAnidado.appendChild(option);
            });

            selectPokemonAnidado.disabled = false;

        } catch (error) {
            console.error('Error in nested endpoint:', error);
            selectPokemonAnidado.innerHTML = '<option value="">Error fetching Pokémon</option>';
        }
    });

    selectPokemonAnidado.addEventListener('change', function() {
        const nombrePokemon = this.value;
        if (nombrePokemon) {
            window.location.href = '/pokemon/' + nombrePokemon;
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        aplicarTema(localStorage.getItem('pokeTema') || 'light');
        aplicarPixelArt(localStorage.getItem('pokePixel') === 'true');
        cargarTipos();
    });
</script>

</body>
</html>
